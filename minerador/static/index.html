const RANGE_TXT = { "24h": "24 h", "3d": "3 dias", "7d": "7 dias", "30d": "30 dias" };

function fmtTime(t, range, long) {
  const d = new Date(t * 1000);
  const hm = d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  const dm = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  if (long) return `${dm} ${hm}`;
  return range === "24h" ? hm : dm;
}
const hrText = ths => { const [v, u] = hashrate(ths); return `${v} ${u}`; };
const hrBig = ths => { const [v, u] = hashrate(ths); return `${v}<small>${u}</small>`; };

// Soma as máquinas visíveis por intervalo (o total da pool fica de fora: já está dentro das máquinas).
function chartBuckets(h) {
  const b = h.bucket_s, first = Math.floor(h.since / b), last = Math.floor(h.until / b), out = [];
  for (let k = first; k <= last; k++) out.push({ t: k * b + b / 2, total: null, parts: [] });
  for (const s of h.series) {
    if (hiddenIds.has(s.id)) continue;
    for (const [t, v] of s.points) {
      const o = out[Math.floor(t / b) - first];
      if (!o) continue;
      o.total = (o.total ?? 0) + v;
      o.parts.push([s.name, v]);
    }
  }
  return out;
}
// Junta intervalos vizinhos para ficar em ~50 barras largas (média de cada máquina no grupo).
function chartGroup(raw, bucket, max = 50) {
  const per = Math.ceil(raw.length / max), out = [];
  for (let i = 0; i < raw.length; i += per) {
    const g = raw.slice(i, i + per), sums = {}, cnt = {};
    for (const o of g) for (const [nm, v] of o.parts) { sums[nm] = (sums[nm] ?? 0) + v; cnt[nm] = (cnt[nm] ?? 0) + 1; }
    const tot = g.filter(o => o.total != null);
    out.push({ t0: g[0].t - bucket / 2, t: g[g.length - 1].t + bucket / 2,
      parts: Object.keys(sums).map(nm => [nm, sums[nm] / cnt[nm]]),
      total: tot.length ? tot.reduce((a, o) => a + o.total, 0) / tot.length : null });
  }
  return out;
}

function drawChart() {
  if (!hist) return;
  const el = document.getElementById("chart"), tip = document.getElementById("tip");
  const all = chartBuckets(hist), raw = all.filter(o => o.total != null);
  const now = raw[raw.length - 1] || null;
  const cur = liveThs ?? now?.total ?? null;   // número grande = total ao vivo; a última barra é a média dos últimos minutos
  const avg = raw.length ? raw.reduce((a, o) => a + o.total, 0) / raw.length : null;
  const bs = chartGroup(all, hist.bucket_s), withData = bs.filter(o => o.total != null);
  const nowIdx = bs.lastIndexOf(withData[withData.length - 1]);

  document.getElementById("hb-num").innerHTML = cur != null ? hrBig(cur) + pulse(cur) : "—";
  const d = document.getElementById("hb-delta");
  if (cur != null && avg) {
    const p = (cur - avg) / avg * 100;
    d.textContent = `${p >= 0 ? "+" : "−"}${nf(Math.abs(p), 1)} % vs média ${RANGE_TXT[hist.range]}`;
    d.className = "hb-delta " + (p >= 0 ? "up" : "down");
  } else { d.textContent = ""; d.className = "hb-delta"; }
  document.getElementById("hb-from").textContent = `há ${RANGE_TXT[hist.range] || ""}`;
  const tile = (k, v) => `<div class="hb-tile"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const totals = raw.map(o => o.total);
  document.getElementById("hb-tiles").innerHTML =
    tile(`Média ${RANGE_TXT[hist.range]}`, avg != null ? hrBig(avg) : "—") +
    tile("Pico", totals.length ? hrBig(Math.max(...totals)) : "—") +
    tile("Mais baixo", totals.length ? hrBig(Math.min(...totals)) : "—") +
    tile("Última leitura", lastOk ? ago(lastOk / 1000) : "—");   // o número grande vem do status ao vivo

  const W = Math.max(280, el.clientWidth), H = W < 560 ? 120 : 150;
  const n = bs.length, step = W / n, gap = step > 4 ? 2 : step > 2 ? 1 : 0, bw = Math.max(1, step - gap), rx = Math.min(3, bw / 2);
  const yMax = Math.max(0, ...withData.map(o => o.total)) * 1.05 || 1;
  let g = `<defs><linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s3)"/><stop offset="1" style="stop-color:var(--s3);stop-opacity:.35"/></linearGradient>
    <linearGradient id="hbn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--s2)"/><stop offset="1" style="stop-color:var(--s2);stop-opacity:.45"/></linearGradient></defs>`;
  bs.forEach((o, i) => {
    const h = o.total == null ? 3 : Math.max(3, o.total / yMax * H);   // intervalo sem leitura = toco baixinho
    g += `<rect class="bar" data-i="${i}" x="${(i * step).toFixed(2)}" y="${(H - h).toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="${rx}"
      fill="${i === nowIdx ? "url(#hbn)" : o.total == null ? "var(--track)" : "url(#hbg)"}"/>`;
  });
  el.querySelectorAll("svg").forEach(x => x.remove());
  el.insertAdjacentHTML("afterbegin", `<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-hidden="true">${g}</svg>`);

  // ----- balão ao passar o mouse (ou setas do teclado): total e cada máquina naquela barra
  function show(i) {
    el.querySelectorAll("rect.on").forEach(r => r.classList.remove("on"));
    if (i == null || !n) { sel = null; el.classList.remove("hovering"); tip.style.display = "none"; return; }
    sel = i = Math.max(0, Math.min(n - 1, i));
    const o = bs[i];
    el.querySelector(`rect[data-i="${i}"]`).classList.add("on");
    el.classList.add("hovering");
    tip.innerHTML = `<div class="t">${fmtTime(o.t0, "", true)} – ${fmtTime(o.t, "24h")}${i === nowIdx ? " · agora" : ""}</div>` +
      (o.total == null ? `<div class="r">Sem leitura</div>`
        : `<div class="r tot"><span>Total</span><b>${hrText(o.total)}</b></div>` +
          o.parts.map(([nm, v]) => `<div class="r"><span>${esc(nm)}</span><span>${hrText(v)}</span></div>`).join(""));
    tip.style.display = "block";
    const px = (i + .5) * step, tw = tip.offsetWidth;
    tip.style.left = `${Math.max(0, px + 12 + tw > W ? px - 12 - tw : px + 12)}px`;
    tip.style.top = `${-tip.offsetHeight - 6}px`;
  }
  el.onpointermove = ev => show(Math.floor((ev.clientX - el.getBoundingClientRect().left) / step));
  el.onpointerleave = () => show(null);
  el.onkeydown = ev => {
    if (ev.key === "ArrowLeft" || ev.key === "ArrowRight") { show(sel == null ? nowIdx : sel + (ev.key === "ArrowRight" ? 1 : -1)); ev.preventDefault(); }
    else if (ev.key === "Escape") show(null);
  };
  el.onblur = () => show(null);

  // ----- tabela (leituras de cada intervalo, sem juntar)
  const names = hist.series.filter(s => s.points.length && !hiddenIds.has(s.id)).map(s => s.name);
  document.getElementById("chart-table").innerHTML = `<table><thead><tr><th>Horário</th><th class="num">Total</th>${names.map(nm => `<th class="num">${esc(nm)}</th>`).join("")}</tr></thead><tbody>` +
    raw.slice().reverse().map(o => `<tr><td>${fmtTime(o.t, "", true)}</td><td class="num">${hrText(o.total)}</td>${names.map(nm => { const p = o.parts.find(x => x[0] === nm); return `<td class="num">${p ? hrText(p[1]) : "—"}</td>`; }).join("")}</tr>`).join("") +
    `</tbody></table>`;
  if (sel != null) show(sel);
}

let wxLoc = null, wxLocAt = 0, wxTz = undefined;   // wxTz: fuso do local fixo (vem da Open-Meteo); undefined = o do aparelho

async function wxFixed() {

    const l = r.ok ? (await r.json()).location : null;
    return l ? { lat: l.lat, lon: l.lon, city: l.name, country: l.country, cc: l.country_code, approx: false, fixed: true } : null;

async function wxLocate() {

  if (!r.ok) throw new Error(r.status);
  const g = await r.json();
  return { lat: coords ? coords.latitude : g.latitude, lon: coords ? coords.longitude : g.longitude,

async function loadWeather() {

    document.getElementById("wx-water").setAttribute("y", (21.1 - 18.6 * Math.min(100, c.relative_humidity_2m) / 100).toFixed(2));

// ------------------------------------------------------------------ globo 3D (WebGL): Terra girando, anel fino e o sol dando voltas
// Texturas NASA Blue Marble / Black Marble (domínio público), 1024×512, em static/img.
// O sol percorre o anel; a face da Terra virada para ele fica de dia, a outra mostra as luzes das cidades.
let globeLoc = null;                                   // [lat, lon] do local do cartão: ponto verde no globo
const GLOBE_R = .58, RING_R = 1.55, RING_TILT = 14 * Math.PI / 180, RING_ROLL = -20 * Math.PI / 180, AXIS_TILT = 23.4 * Math.PI / 180;

const GLOBE_FS = `precision highp float;
varying vec2 vP;
uniform sampler2D uDay, uNight;
uniform float uRot, uTilt, uScale, uPx, uPulse;
uniform vec3 uSun, uLoc;
void main() {
  vec2 p = vP / uScale;
  float r = length(p);
  vec3 sunN = normalize(uSun);
  float lit = clamp(dot(normalize(vec3(p, 0.15)), sunN) * .8 + .35, .08, 1.);
  float atmA = exp(-max(r - 1., 0.) * 13.) * .6 * lit;

function globeInit() {

  const ringPt = a => {

      gl.uniform1f(u.rot, rot); gl.uniform1f(u.tilt, AXIS_TILT); gl.uniform1f(u.scale, GLOBE_R); gl.uniform1f(u.px, k);
      gl.uniform3f(u.sun, sun[0], sun[1], sun[2]);
      gl.uniform1f(u.pulse, (t * .6) % 1);

      const a = Math.random() * Math.PI * 2, sp = ring ? power : power * (.25 + Math.random() * .8);
      sparks.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: .45 + Math.random() * .45,
                    c: i % 3 ? r.c : c2, s: 1.4 + Math.random() * 1.6, tw: Math.random() < .25 });
    }
  };
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (now > nextLaunch && now - t0 < 16000) {
      launch(); if (Math.random() < .4) launch();
      nextLaunch = now + 320 + Math.random() * 520;
    }
    ctx.globalCompositeOperation = "destination-out";             // apaga aos poucos = rastro
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(0, 0, W, Hh);
    ctx.globalCompositeOperation = "lighter";
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.vy += G * dt; r.x += r.vx * dt; r.y += r.vy * dt;
      ctx.globalAlpha = 1; ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 2.3, 0, 7); ctx.fill();
      if (r.vy > -30) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.vx *= .983; p.vy = p.vy * .983 + 95 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= p.decay * dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.tw ? p.life * (.4 + .6 * Math.random()) : p.life;
      ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (now - t0 > 16000 && !rockets.length && !sparks.length) cancelAnimationFrame(raf);
  }
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", size); };
}

async function loadBlocks() {
  try {
    const r = await fetch(`/api/blocks?view=${encodeURIComponent(bview)}`, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    if (d.view === bview) renderBlocks(d);       // ignora resposta atrasada de outro filtro
  } catch (e) {
    document.getElementById("blocks-body").innerHTML = '<div class="err">Não foi possível carregar os blocos.</div>';
    mpStart();
  }
}
function setBlockView(v) {
  bview = v;
  try { localStorage.setItem("minerador.blocks", v); } catch (e) {}
  document.querySelectorAll("#bviews button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  const sel = document.getElementById("bpool");
  sel.value = v.startsWith("pool:") ? v.slice(5) : "";
  sel.classList.toggle("on", v.startsWith("pool:"));
  loadBlocks();
}
async function loadBlockPools() {
  try {
    const d = await (await fetch("/api/blocks/pools")).json();
    bpools = d.pools || [];
    const sel = document.getElementById("bpool");
    sel.innerHTML = '<option value="">Outra pool…</option>' + bpools.map(p =>
      `<option value="${esc(p.slug)}">${esc(POOL_NAMES[p.slug] || p.name)}${p.blocks != null ? ` · ${p.blocks.toLocaleString("pt-BR")} no último ano` : ""}</option>`).join("");
    if (bview.startsWith("pool:")) { sel.value = bview.slice(5); sel.classList.add("on"); }
    document.getElementById("bq-pools").innerHTML = bpools.map(p => `<option value="${esc(POOL_NAMES[p.slug] || p.name)}">`).join("");
  } catch (e) {}
}
// ------------------------------------------------------------------ busca (abre no mempool.space)
let mempoolBase = "https://mempool.space";
function searchTarget(raw) {
  const q = raw.trim();
  if (!q) return null;
  const digits = q.replace(/[.\s]/g, "");                 // "975.900" (pt-BR) também vale
  if (/^\d{1,7}$/.test(digits)) return { url: `${mempoolBase}/block/${digits}` };
  const hex = q.match(/^([0-9a-f]{64})(?::\d+)?$/i);       // txid ou txid:saída
  if (hex) return { url: `${mempoolBase}/${/^0{8}/.test(hex[1]) ? "block" : "tx"}/${hex[1].toLowerCase()}` };
  if (/^(bc1|tb1|bcrt1)[02-9ac-hj-np-z]{8,87}$/i.test(q) || /^[13mn2][1-9A-HJ-NP-Za-km-z]{25,34}$/.test(q))
    return { url: `${mempoolBase}/address/${q}` };
  const name = q.toLowerCase(), label = p => (POOL_NAMES[p.slug] || p.name || "").toLowerCase();
  const pool = bpools.find(p => label(p) === name || p.slug === name)
    || bpools.find(p => label(p).startsWith(name)) || (name.length >= 3 && bpools.find(p => label(p).includes(name)));
  if (pool) return { pool: pool.slug };
  return null;
}
document.getElementById("bsearch").addEventListener("submit", ev => {
  ev.preventDefault();
  const input = document.getElementById("bq"), msg = document.getElementById("bq-msg");
  const t = searchTarget(input.value);
  if (!input.value.trim()) { input.focus(); return; }
  if (!t) { msg.textContent = "Não reconheci. Digite a altura ou o hash de um bloco, o id de uma transação, um endereço ou o nome de uma pool."; return; }
  msg.textContent = "";
  if (t.pool) { setBlockView(`pool:${t.pool}`); input.value = ""; input.blur(); }
  else window.open(t.url, "_blank", "noopener");
});
document.getElementById("bq").addEventListener("input", () => { document.getElementById("bq-msg").textContent = ""; });
