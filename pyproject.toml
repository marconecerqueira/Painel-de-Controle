[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minerador"
version = "0.1.0"
description = "Painel remoto para mineradores de Bitcoin (LuxOS, AxeOS, pools)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
minerador = "minerador.__main__:main"

[tool.setuptools.packages.find]
include = ["minerador*"]

[tool.setuptools.package-data]
minerador = ["static/*", "static/fonts/*", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
