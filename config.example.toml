# Copie para config.toml e ajuste os IPs e endereços.

[server]
# Escuta só localmente; o acesso remoto é via `tailscale serve` (ver docs/instalacao-pi.md).
host = "127.0.0.1"
port = 8080
db_path = "minerador.db"
retention_days = 30  # leituras brutas mais antigas são apagadas

[finance]
energy_eur_kwh = 0.14        # tarifa de energia do hosting (€/kWh); use ponto, não vírgula

[intervals]          # segundos
local = 15           # consulta direta às máquinas (LuxOS / AxeOS)
pools = 60           # consulta às APIs das pools

# ---------------------------------------------------------------- máquinas
[[miners]]
id = "s19jxp"
name = "Antminer S19j XP"
type = "luxos"               # API TCP 4028
host = "192.168.1.50"
port = 4028
pool = "defisurfers"         # id de uma entrada em [pools.*]
# worker = "s19"             # opcional: se omitido, é deduzido do usuário stratum "endereco.worker"
expected_ths = 140           # opcional: usado no alerta de hashrate baixo
temp_max_c = 80
power_w = 3010               # opcional: consumo nominal, usado quando a máquina não informa a potência
# energy_eur_month = 90      # opcional: taxa fixa de energia por mês (substitui a tarifa por kWh)

[[miners]]
id = "bitaxe"
name = "Bitaxe"
type = "axeos"               # API HTTP
host = "192.168.1.51"
pool = "defisurfers"
temp_max_c = 70
vr_temp_max_c = 90

[[miners]]
id = "nerdminer"
name = "NerdMiner"
type = "pool_only"           # sem API local: status vem só da pool
pool = "parasite"
worker = "nerdminer"         # nome do worker usado no stratum (endereco.<worker>)

# ---------------------------------------------------------------- pools
[pools.defisurfers]
type = "defisurfers"
address = "bc1q_SEU_ENDERECO"
base_url = "https://pool.defisurfers.xyz"
# fee_pct = 1.5               # opcional: taxa da pool (%), descontada da receita esperada

[pools.parasite]
type = "parasite"
address = "bc1q_SEU_ENDERECO"
base_url = "https://parasite.space"

# Aluguel de hashrate com financeiro (custo × valor esperado):
# [[miners]]
# id = "aluguel-solo"
# name = "Aluguel solo BCH"
