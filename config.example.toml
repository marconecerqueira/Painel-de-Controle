# rental_hours = 19                     # duração contratada
# rental_start = "2026-11-16 23:39"     # opcional (hora local); sem ele, o painel detecta o início

# Pool híbrida de Bitcoin Cash (PPLNS + solo). Aluguéis de hash: type = "rental" + worker.
# [pools.hashcommander]
# type = "hashcommander"
# address = "qp_SEU_ENDERECO_BCH"      # com ou sem "bitcoincash:"
# base_url = "https://hashcommander-pool.duckdns.org"

# ---------------------------------------------------------------- blocos (mempool.space)
# Seção "Blocos encontrados" do painel. Opcional.
# [blocks]
# my_pools = ["parasite"]               # slugs extras para o filtro "Minhas pools"
# base_url = "https://mempool.space"    # ou o seu próprio mempool (Umbrel/Start9)

# ---------------------------------------------------------------- hora local e tempo
# Cartão abaixo do gráfico. Sem esta seção, usa a localização do aparelho que abre o painel.
# [location]
# name = "Porto"
# country = "Portugal"
# country_code = "PT"
# lat = 41.1496
# lon = -8.611

# ---------------------------------------------------------------- alertas
# Passo a passo: docs/alertas-telegram.md. Vazio = alertas só no painel.
[telegram]
bot_token = ""
chat_id = ""

# [alerts]                 # tempos de espera (minutos) — valores padrão:
# offline_min = 3
# hashrate_min = 10
# temp_min = 1
# pool_min = 10
# rental_min = 3
# low_hashrate_pct = 70
